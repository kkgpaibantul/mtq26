<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#0F9488" />
<meta name="format-detection" content="telephone=no" />
<meta name="description" content="Pemantauan live panggung & daftar peserta MTQ Pelajar SD Kabupaten Bantul 2026" />
<title>Pemantauan MTQ 2026 — Bantul</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preconnect" href="https://script.google.com" crossorigin />
<link rel="dns-prefetch" href="https://script.google.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

<style>
/* ============================================================================
 * §1 DESIGN TOKENS
 * ============================================================================ */
:root {
  --rose-deep: #3F1F2E;
  --rose: #8B4A66;
  --rose-soft: #F5E6EC;
  --hijau: #0F9488;
  --hijau-deep: #0B7268;
  --hijau-soft: #E0F7F4;
  --gold: #E5A643;
  --gold-soft: #FEF4E2;

  --ink: #1A2332;
  --ink-soft: #52616E;
  --ink-muted: #94A0AC;

  --bg: #F4F7FA;
  --surface: #FFFFFF;
  --surface-soft: #FAFBFC;
  --border: #E4E9EE;
  --border-strong: #CBD5E0;

  --danger: #DC2626;

  --shadow-xs: 0 1px 2px rgba(15, 23, 42, 0.04);
  --shadow-sm: 0 2px 4px -1px rgba(15, 23, 42, 0.06), 0 1px 2px -1px rgba(15, 23, 42, 0.04);
  --shadow-md: 0 4px 12px -2px rgba(15, 23, 42, 0.08), 0 2px 4px -2px rgba(15, 23, 42, 0.04);
  --shadow-lg: 0 12px 32px -4px rgba(15, 23, 42, 0.12), 0 4px 8px -4px rgba(15, 23, 42, 0.06);

  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 18px;
  --r-full: 999px;

  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --trans: 250ms var(--ease-out);

  --container: 1240px;
  --header-h: 118px;
}

/* ============================================================================
 * §2 RESET & BASE
 * ============================================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  min-height: 100dvh;
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--ink);
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: clip;
}
h1, h2, h3, h4 { font-family: 'Fraunces', Georgia, serif; line-height: 1.2; color: var(--rose-deep); letter-spacing: -0.01em; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input { font-family: inherit; font-size: 16px; }
a { color: inherit; text-decoration: none; }
img, svg { display: block; max-width: 100%; }
:focus-visible { outline: 3px solid var(--hijau); outline-offset: 3px; border-radius: 6px; }

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
@keyframes pulseDot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.15); } }
@keyframes shimmer {
  0% { background-position: -400px 0; }
  100% { background-position: 400px 0; }
}

.spinner {
  display: inline-block; width: 24px; height: 24px;
  border: 2.5px solid var(--hijau-soft);
  border-top-color: var(--hijau);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}

.skip-link {
  position: absolute; left: -9999px; top: 0;
  padding: 0.5rem 1rem; background: var(--rose-deep); color: #fff; z-index: 999;
}
.skip-link:focus { left: 1rem; top: 1rem; }

/* ============================================================================
 * §3 STICKY HEADER
 * ============================================================================ */
.sticky-header {
  position: sticky; top: 0; z-index: 50;
  background: rgba(244, 247, 250, 0.82);
  backdrop-filter: saturate(180%) blur(16px);
  -webkit-backdrop-filter: saturate(180%) blur(16px);
  border-bottom: 1px solid var(--border);
  transition: var(--trans);
}
.appbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0.85rem 1.25rem;
  max-width: var(--container); margin: 0 auto;
}
.brand {
  display: flex; align-items: center; gap: 0.65rem;
  font-weight: 800; font-size: 1.05rem; color: var(--rose-deep);
  letter-spacing: -0.01em;
}
.brand-mark {
  width: 36px; height: 36px;
  background: linear-gradient(135deg, var(--hijau), var(--hijau-deep));
  border-radius: 10px;
  display: grid; place-items: center;
  color: #fff;
  box-shadow: var(--shadow-sm), inset 0 1px 0 rgba(255,255,255,0.25);
}
.brand-mark svg { width: 20px; height: 20px; }
.appbar-actions { display: flex; gap: 0.5rem; align-items: center; }
.btn-ghost {
  display: inline-flex; align-items: center; gap: 0.4rem;
  font-size: 0.85rem; font-weight: 700;
  color: var(--ink);
  padding: 0.5rem 0.9rem;
  border-radius: var(--r-full);
  border: 1.5px solid var(--border-strong);
  background: var(--surface);
  transition: var(--trans);
  white-space: nowrap;
}
.btn-ghost:hover { border-color: var(--hijau); color: var(--hijau-deep); background: var(--hijau-soft); transform: translateY(-1px); }
.btn-ghost svg { width: 16px; height: 16px; }

.tabs-wrap {
  display: flex; justify-content: center;
  padding: 0 1rem 0.9rem;
  max-width: var(--container); margin: 0 auto;
}
.tabs-nav {
  display: inline-flex;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--r-full);
  padding: 0.28rem;
  box-shadow: var(--shadow-xs);
}
.tab-btn {
  display: inline-flex; align-items: center; gap: 0.45rem;
  padding: 0.55rem 1.15rem;
  border-radius: var(--r-full);
  font-weight: 700; font-size: 0.88rem;
  color: var(--ink-soft);
  transition: var(--trans);
  white-space: nowrap;
}
.tab-btn:hover { color: var(--hijau-deep); }
.tab-btn.active {
  background: linear-gradient(135deg, var(--hijau), var(--hijau-deep));
  color: #fff;
  box-shadow: 0 3px 10px -2px rgba(15, 148, 136, 0.5);
}
.tab-btn svg { width: 15px; height: 15px; }

/* ============================================================================
 * §4 LAYOUT
 * ============================================================================ */
.container {
  max-width: var(--container);
  margin: 0 auto;
  padding: 2rem 1.25rem 6rem;
}
.hero { text-align: center; margin-bottom: 2.5rem; padding-top: 0.5rem; }
.hero-eyebrow {
  display: inline-flex; align-items: center; gap: 0.55rem;
  font-size: 0.72rem; font-weight: 800;
  color: var(--hijau-deep);
  background: var(--hijau-soft);
  padding: 0.35rem 0.8rem;
  border-radius: var(--r-full);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  margin-bottom: 1rem;
  transition: var(--trans);
}
.conn-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--hijau);
  box-shadow: 0 0 0 3px rgba(15, 148, 136, 0.15);
  transition: var(--trans);
}
.hero-eyebrow.warn { background: var(--gold-soft); color: #92400E; }
.hero-eyebrow.warn .conn-dot { background: var(--gold); box-shadow: 0 0 0 3px rgba(229, 166, 67, 0.15); }
.hero-eyebrow.error { background: #FEE2E2; color: #991B1B; }
.hero-eyebrow.error .conn-dot { background: var(--danger); box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.15); animation: pulseDot 1.5s infinite; }

.hero h1 {
  font-size: clamp(1.8rem, 4vw, 2.6rem);
  font-weight: 900;
  margin-bottom: 0.7rem;
  letter-spacing: -0.025em;
}
.hero p {
  font-size: 0.95rem;
  color: var(--ink-soft);
  max-width: 620px;
  margin: 0 auto;
  line-height: 1.65;
}
.tab-pane { display: none; }
.tab-pane.active { display: block; animation: fadeIn 0.35s var(--ease-out); }

/* ============================================================================
 * §5 LIVE CARDS
 * ============================================================================ */
.live-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 1.15rem;
}
.live-card {
  position: relative;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--r-lg);
  padding: 1.15rem 1.2rem 1rem;
  display: flex; flex-direction: column; gap: 0.85rem;
  box-shadow: var(--shadow-sm);
  transition: var(--trans);
  overflow: hidden;
}
.live-card::before {
  content: ''; position: absolute;
  top: 0; left: 0; right: 0; height: 3px;
  background: var(--border-strong);
  transition: var(--trans);
}
.live-card[data-status="berlangsung"]::before { background: var(--hijau); }
.live-card[data-status="istirahat"]::before   { background: var(--gold); }
.live-card[data-status="selesai"]::before     { background: var(--rose); }
.live-card.is-live {
  border-color: var(--hijau);
  box-shadow: 0 8px 24px -8px rgba(15, 148, 136, 0.35);
  transform: translateY(-2px);
}

.lc-header { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; }
.lc-kode {
  font-family: 'Plus Jakarta Sans', monospace;
  font-size: 0.72rem; font-weight: 800;
  letter-spacing: 0.08em;
  color: var(--hijau-deep);
  background: var(--hijau-soft);
  padding: 0.25rem 0.55rem;
  border-radius: 6px;
  border: 1px solid rgba(15, 148, 136, 0.15);
}
.lc-badge {
  font-size: 0.65rem; font-weight: 800;
  text-transform: uppercase; letter-spacing: 0.06em;
  padding: 0.28rem 0.65rem;
  border-radius: var(--r-full);
  white-space: nowrap;
}
.lc-badge.belum       { background: var(--border); color: var(--ink-soft); }
.lc-badge.berlangsung { background: var(--hijau); color: #fff; animation: pulseDot 2.2s infinite; }
.lc-badge.istirahat   { background: var(--gold-soft); color: #92400E; }
.lc-badge.selesai     { background: var(--rose-deep); color: #fff; }

.lc-title {
  font-family: 'Fraunces', serif;
  font-size: 1.02rem; font-weight: 800;
  color: var(--rose-deep);
  line-height: 1.25;
  letter-spacing: -0.005em;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.lc-body {
  background: var(--surface-soft);
  border: 1.5px dashed var(--border-strong);
  border-radius: var(--r-md);
  padding: 1rem 0.9rem;
  text-align: center;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 118px;
  gap: 0.15rem;
  transition: var(--trans);
}
.live-card.is-live .lc-body {
  background: linear-gradient(180deg, #F0FDFA 0%, #ECFDF5 100%);
  border-style: solid;
  border-color: rgba(15, 148, 136, 0.3);
}
.lc-label {
  font-size: 0.68rem; font-weight: 800;
  text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--ink-muted);
  margin-bottom: 0.35rem;
}
.lc-main {
  font-family: 'Fraunces', serif;
  font-size: 1.85rem;
  font-weight: 900;
  color: var(--hijau-deep);
  line-height: 1.05;
  letter-spacing: -0.01em;
  word-break: break-word;
}
.lc-main.lc-finished {
  font-size: 1.35rem;
  color: var(--rose-deep);
  letter-spacing: 0;
  margin-top: 0.5rem;
}
.lc-timer {
  font-family: 'Fraunces', serif;
  font-size: 1.9rem; font-weight: 900;
  color: var(--rose-deep);
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.02em;
  line-height: 1.05;
  transition: color 200ms;
}
.lc-timer.is-timeup { color: var(--danger); }
.lc-timeup { color: var(--danger); font-weight: 800; font-size: 0.72rem; letter-spacing: 0.06em; margin-top: 0.4rem; }
.lc-phase {
  font-family: 'Fraunces', serif;
  font-size: 1.35rem; font-weight: 900;
  color: var(--rose-deep);
  line-height: 1.15;
  word-break: break-word;
}
.lc-footer {
  display: flex; justify-content: space-between; align-items: center;
  gap: 0.5rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  padding: 0.55rem 0.8rem;
  font-size: 0.78rem; font-weight: 600;
  color: var(--ink-soft);
}
.lc-footer strong { color: var(--rose-deep); font-size: 0.85rem; font-weight: 800; }
.lc-footer .lc-progress { color: var(--hijau-deep); font-weight: 800; }

/* ---- Skeleton ---- */
.live-card.skeleton { pointer-events: none; }
.skel-header { display: flex; justify-content: space-between; align-items: center; }
.skel-box {
  display: inline-block;
  background: linear-gradient(90deg, var(--border) 0%, var(--surface-soft) 50%, var(--border) 100%);
  background-size: 400px 100%;
  animation: shimmer 1.4s infinite linear;
  border-radius: 4px;
}
.skel-body {
  background: var(--surface-soft);
  border: 1.5px dashed var(--border-strong);
  border-radius: var(--r-md);
  padding: 1rem 0.9rem;
  text-align: center;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 118px;
}

/* ============================================================================
 * §6 FULLSCREEN
 * ============================================================================ */
.fs-title { display: none; }
body.is-fullscreen { overflow: hidden; background: var(--bg); }
body.is-fullscreen .sticky-header,
body.is-fullscreen .hero { display: none !important; }
body.is-fullscreen .container {
  max-width: 100%; padding: 0;
  height: 100dvh;
  display: flex; flex-direction: column;
}
body.is-fullscreen .fs-title {
  display: flex; align-items: center; justify-content: center;
  gap: 0.7rem;
  padding: 1.1rem 1rem 0.75rem;
  font-family: 'Fraunces', serif;
  font-size: 1.55rem; font-weight: 900;
  color: var(--rose-deep);
  letter-spacing: -0.02em;
  flex-shrink: 0;
}
body.is-fullscreen .fs-title svg { color: var(--hijau); }
body.is-fullscreen .fs-title .fs-clock {
  font-family: 'Plus Jakarta Sans', monospace;
  font-size: 0.9rem; font-weight: 700;
  color: var(--ink-soft);
  background: var(--surface);
  padding: 0.3rem 0.8rem;
  border-radius: var(--r-full);
  border: 1px solid var(--border);
  font-variant-numeric: tabular-nums;
}
body.is-fullscreen #tab-live {
  flex: 1; min-height: 0;
  padding: 0 1rem 1rem;
  display: flex; flex-direction: column;
}
body.is-fullscreen .live-grid {
  flex: 1; min-height: 0;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(3, 1fr);
  gap: 0.9rem;
}
body.is-fullscreen .live-card {
  height: 100%; margin: 0;
  padding: 0.9rem 1rem 0.8rem;
  gap: 0.6rem;
}
body.is-fullscreen .lc-title { font-size: 1rem; -webkit-line-clamp: 2; }
body.is-fullscreen .lc-body { flex: 1; min-height: 0; padding: 0.6rem; }
body.is-fullscreen .lc-main { font-size: 2.4rem; }
body.is-fullscreen .lc-main.lc-finished { font-size: 1.6rem; }
body.is-fullscreen .lc-timer { font-size: 2.4rem; }
body.is-fullscreen .lc-phase { font-size: 1.5rem; }

/* ============================================================================
 * §7 PESERTA (daftar ringkas, filter + urut)
 * ============================================================================ */
.pt { max-width: 1040px; margin: 0 auto 0.75rem; }
.pt-bar { position: sticky; top: calc(var(--header-h) + 0.4rem); z-index: 20; display: flex; gap: 0.5rem; align-items: center; margin-bottom: 0.6rem; }
.search-box { position: relative; flex: 1; min-width: 0; }
.search-box input {
  width: 100%; padding: 0.75rem 2.6rem 0.75rem 2.7rem;
  border: 1.5px solid var(--border); border-radius: var(--r-full);
  font-size: 0.95rem; font-weight: 500; background: var(--surface);
  box-shadow: var(--shadow-md); transition: var(--trans); outline: none;
}
.search-box input::placeholder { color: var(--ink-muted); }
.search-box input:focus { border-color: var(--hijau); box-shadow: 0 0 0 4px var(--hijau-soft), var(--shadow-md); }
.search-box > svg { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--ink-muted); pointer-events: none; }
.pt-clear { position: absolute; right: 0.4rem; top: 50%; transform: translateY(-50%); width: 30px; height: 30px; border-radius: 50%; color: var(--ink-soft); display: none; place-items: center; font-size: 1.1rem; line-height: 1; }
.pt-clear.show { display: grid; }
.pt-clear:hover { background: var(--hijau-soft); }
.pt-toggle {
  display: none; align-items: center; gap: 0.4rem; flex: none;
  padding: 0.7rem 0.95rem; border-radius: var(--r-full); font-weight: 700; font-size: 0.85rem;
  background: var(--surface); border: 1.5px solid var(--border); box-shadow: var(--shadow-md);
}
.pt-toggle .pt-badge { background: var(--hijau); color: #fff; border-radius: var(--r-full); font-size: 0.7rem; min-width: 18px; height: 18px; padding: 0 5px; display: none; place-items: center; }
.pt-toggle .pt-badge.show { display: inline-grid; }

.pt-panel { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--r-md); padding: 0.8rem; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; gap: 0.7rem; }
.pt-chips { display: flex; flex-wrap: wrap; gap: 0.4rem; }
.chip {
  display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.38rem 0.75rem;
  border-radius: var(--r-full); border: 1.5px solid var(--border); background: var(--surface-soft);
  font-size: 0.8rem; font-weight: 700; color: var(--ink-soft); transition: var(--trans);
}
.chip small { font-size: 0.7rem; font-weight: 700; color: var(--ink-muted); }
.chip:hover { border-color: var(--hijau); color: var(--hijau-deep); }
.chip[aria-pressed="true"] { background: var(--hijau); border-color: var(--hijau); color: #fff; }
.chip[aria-pressed="true"] small { color: rgba(255,255,255,.85); }
.chip[disabled] { opacity: .45; cursor: default; }
.pt-row { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: flex-end; }
.pt-field { display: flex; flex-direction: column; gap: 0.2rem; min-width: 0; flex: 1 1 150px; }
.pt-field > span { font-size: 0.65rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); }
.pt-field select {
  width: 100%; padding: 0.5rem 0.6rem; border: 1.5px solid var(--border); border-radius: var(--r-sm);
  background: var(--surface); font: inherit; font-size: 0.88rem; font-weight: 600; color: var(--ink);
}
.pt-field select:focus { outline: none; border-color: var(--hijau); box-shadow: 0 0 0 3px var(--hijau-soft); }
.pt-btn { padding: 0.5rem 0.9rem; border-radius: var(--r-sm); border: 1.5px solid var(--border); background: var(--surface); font-weight: 700; font-size: 0.85rem; white-space: nowrap; }
.pt-btn:hover { border-color: var(--hijau); color: var(--hijau-deep); }
.pt-btn[hidden] { display: none; }
.pt-count { margin-top: 0.55rem; font-size: 0.82rem; font-weight: 600; color: var(--ink-soft); display: flex; justify-content: space-between; gap: 0.5rem; flex-wrap: wrap; }

/* Header kolom (klik = urutkan) */
.pl-head, .peserta-row { display: grid; grid-template-columns: 112px minmax(0,1.5fr) minmax(0,1.3fr) 130px 84px; gap: 0.75rem; align-items: center; }
.pl-head { max-width: 1040px; margin: 0 auto; padding: 0.5rem 1rem; background: var(--hijau-soft); border: 1.5px solid var(--border); border-radius: var(--r-md) var(--r-md) 0 0; border-bottom: 0; }
.pl-head button { text-align: left; font-size: 0.68rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--hijau-deep); display: inline-flex; align-items: center; gap: 0.25rem; padding: 0.2rem 0; }
.pl-head button .ar { opacity: 0; font-size: 0.7rem; }
.pl-head button[aria-sort] .ar { opacity: 1; }
.pl-head button:hover { color: var(--ink); }

.peserta-list { max-width: 1040px; margin: 0 auto; background: var(--surface); border: 1.5px solid var(--border); border-radius: 0 0 var(--r-md) var(--r-md); overflow: hidden; box-shadow: var(--shadow-sm); }
.peserta-row { padding: 0.6rem 1rem; border-top: 1px solid var(--border); font-size: 0.9rem; transition: background .15s; contain: content; }
.peserta-row:first-child { border-top: 0; }
.peserta-row:hover { background: var(--surface-soft); }
.pr-no { white-space: nowrap; font-size: 0.72rem; font-weight: 700; color: var(--ink-muted); font-variant-numeric: tabular-nums; }
.pr-name { font-weight: 700; color: var(--ink); line-height: 1.3; }
.pr-sub { font-size: 0.75rem; color: var(--ink-muted); font-weight: 500; line-height: 1.35; margin-top: 0.1rem; }
.pr-school { color: var(--ink-soft); font-weight: 500; line-height: 1.35; }
.pr-kap { font-weight: 600; color: var(--ink); }
.pr-cab { justify-self: start; font-size: 0.72rem; font-weight: 800; color: var(--rose-deep); background: var(--rose-soft); padding: 0.2rem 0.55rem; border-radius: var(--r-full); }
.pl-group { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: baseline; padding: 0.45rem 1rem; background: var(--bg); border-top: 1px solid var(--border-strong); border-bottom: 1px solid var(--border); font-size: 0.78rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--rose); }
.pl-group small { font-size: 0.72rem; font-weight: 700; color: var(--ink-muted); letter-spacing: 0; text-transform: none; }
.pl-more { display: block; margin: 1rem auto 0; max-width: 1040px; }
.pl-more[hidden] { display: none; }
.pl-more .pt-btn { display: block; margin: 0 auto; padding: 0.65rem 1.4rem; }

/* Empty State */
.empty-state {
  text-align: center;
  padding: 4rem 1rem;
  color: var(--ink-soft);
}
.empty-state svg {
  width: 56px; height: 56px;
  margin: 0 auto 1rem;
  color: var(--ink-muted);
  opacity: 0.4;
}
.empty-state p { font-size: 0.95rem; font-weight: 500; max-width: 320px; margin: 0 auto; line-height: 1.55; }

/* ============================================================================
 * §8 RESPONSIVE
 * ============================================================================ */
@media (max-width: 900px) {
  :root { --header-h: 112px; }
  .hide-mobile { display: none !important; }
  body.is-fullscreen { overflow: auto; }
  body.is-fullscreen .container { height: auto; min-height: 100dvh; overflow: visible; padding-bottom: 2rem; }
  body.is-fullscreen #tab-live { flex: none; height: auto; padding: 0 1rem 2rem; }
  body.is-fullscreen .live-grid { grid-template-columns: 1fr; grid-template-rows: auto; height: auto; gap: 1rem; }
  body.is-fullscreen .live-card { height: auto; min-height: 200px; }
  body.is-fullscreen .fs-title { font-size: 1.2rem; padding: 0.9rem 1rem 0.5rem; }

  /* Responsif untuk List Peserta */
  .pt-toggle { display: inline-flex; }
  .pt-panel { display: none; }
  .pt-panel.open { display: flex; }
  .pl-head { display: none; }
  .peserta-list { border-radius: var(--r-md); }
  .peserta-row { grid-template-columns: minmax(0,1fr) auto; gap: 0.15rem 0.6rem; padding: 0.7rem 0.9rem; }
  .peserta-row .pr-no { grid-column: 1; grid-row: 3; }
  .peserta-row .pr-main { grid-column: 1; grid-row: 1; }
  .peserta-row .pr-cab { grid-column: 2; grid-row: 1; align-self: start; }
  .peserta-row .pr-school { grid-column: 1 / -1; grid-row: 2; font-size: 0.82rem; }
  .peserta-row .pr-kap { grid-column: 1 / -1; grid-row: 3; font-size: 0.8rem; color: var(--ink-soft); }
  .peserta-row .pr-no { display: none; }
}

@media (max-width: 640px) {
  :root { --header-h: 108px; }
  .container { padding: 1.5rem 1rem 5rem; }
  .appbar { padding: 0.7rem 1rem; }
  .brand span { font-size: 0.95rem; }
  .btn-ghost { padding: 0.45rem 0.75rem; font-size: 0.8rem; }
  .hero h1 { font-size: 1.75rem; }
  .hero p { font-size: 0.88rem; }
  .live-grid { grid-template-columns: 1fr; gap: 1rem; }
  .pt-bar { top: calc(var(--header-h) + 0.25rem); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
</style>

<script>
'use strict';
(() => {
  /* =========================================================================
   * §1 KONFIGURASI
   * ========================================================================= */
  const API_URL = 'https://script.google.com/macros/s/AKfycbxK9HQwo5_qqME-Vus5JNbHMO3HaJRELMAhlVjsOfO65uKlh_MdjwaexaQyRIQ2FVQlQQ/exec';
  const POLL_INTERVAL = 15000;
  const POLL_JITTER = 3000;          // sebaran acak agar ratusan penonton tidak menembak server serentak
  const FETCH_TIMEOUT = 15000;       // cold start Apps Script bisa >10 detik
  const MAX_BACKOFF = 60000;
  const BACKOFF_STEP = 5000;
  const SEARCH_DEBOUNCE = 250;
  const CACHE_TTL_MS = 5 * 60 * 1000;

  const LIVE_CACHE_KEY = 'mtq26_live_v4';
  const PESERTA_CACHE_KEY = 'mtq26_peserta_v4';

  const ORDER = ['MTQ','MTtQ','MHQ','Puitisasi','MAz','LPP','LCP','Lukis','Menyanyi'];
  const STATUS_LABEL = {
    belum: 'Belum Mulai',
    berlangsung: 'Berlangsung',
    istirahat: 'Istirahat',
    selesai: 'Selesai'
  };

  /* =========================================================================
   * §2 STATE
   * ========================================================================= */
  const state = {
    activeTab: 'tab-live',
    live: {
      inFlight: false,
      controller: null,
      timeoutId: null,
      timedOut: false,
      pollTimeout: null,
      lastHash: '',
      serverOffset: 0,
      retryDelay: 0,
      loadedOnce: false
    },
    peserta: {
      inFlight: false,
      controller: null,
      timeoutId: null,
      timedOut: false,
      loaded: false,
      rendered: false,
      raw: '',
      data: [],
      filteredData: []
    },
    ticker: null,
    fsClock: null
  };

  /* =========================================================================
   * §3 DOM CACHE
   * ========================================================================= */
  const $  = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

  const el = {};
  function cacheDom() {
    el.liveGrid    = $('#liveGrid');
    el.pesertaGrid = $('#pesertaGrid');
    el.searchInput = $('#searchPeserta');
    el.ptMore      = $('#plMore');
    el.connBadge   = $('#connBadge');
    el.connLabel   = $('#connLabel');
    el.btnFs       = $('#btnFullscreen');
    el.fsIcon      = $('#fsIcon');
    el.fsLabel     = $('#fsLabel');
    el.fsClock     = $('#fsClock');
    el.tabBtns     = $$('.tab-btn');
    el.tabPanes    = $$('.tab-pane');
    el.tabLive     = $('#tab-live');
  }

  /* =========================================================================
   * §4 UTIL
   * ========================================================================= */
  const ESC_MAP = { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' };
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ESC_MAP[c]);

  function fmtTimer(sec) {
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const s = sec % 60;
    return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }

  function fmtClock(d) {
    return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  }

  function setConnBadge(status) {
    if (!el.connBadge) return;
    el.connBadge.classList.remove('warn', 'error');
    if (status === 'warn') {
      el.connBadge.classList.add('warn');
      el.connLabel.textContent = 'Menghubungkan...';
    } else if (status === 'error') {
      el.connBadge.classList.add('error');
      el.connLabel.textContent = 'Offline';
    } else {
      el.connLabel.textContent = 'Live Monitor';
    }
  }

  /** Waktu berakhir timer (ms epoch). Prioritas: nilai server (timer_end_ms), cadangan: start + durasi. */
  function timerEndMs(c) {
    const e = Number(c.timer_end_ms);
    if (Number.isFinite(e) && e > 0) return e;
    const start = c.timer_start ? new Date(c.timer_start).getTime() : 0;
    const dur = Number(c.timer_duration_sec) || 0;
    return start && dur ? start + dur * 1000 : 0;
  }

  function hashLiveData(cabangList) {
    let h = '';
    for (const c of cabangList) {
      h += c.key + '|' +
           c.status_lomba + '|' +
           (c.phase_label || '') + '|' +
           (c.timer_start || '') + '|' +
           (c.timer_end_ms || '') + '|' +
           (c.timer_duration_sec || '') + '|' +
           (c.sekarang ? c.sekarang.No_Undian : '') + '|' +
           (c.berikut ? c.berikut.No_Undian : '') + '|' +
           (c.sudah_tampil || 0) + '|' +
           (c.total_peserta || 0) + ';';
    }
    return h;
  }

  /* =========================================================================
   * §5 CACHE (sessionStorage — instant paint)
   * ========================================================================= */
  function saveCache(key, payload) {
    try {
      sessionStorage.setItem(key, JSON.stringify({ t: Date.now(), d: payload }));
    } catch (_) {}
  }

  function loadCache(key) {
    try {
      const raw = sessionStorage.getItem(key);
      if (!raw) return null;
      const obj = JSON.parse(raw);
      if (!obj || !obj.t) return null;
      if (Date.now() - obj.t > CACHE_TTL_MS) {
        try { sessionStorage.removeItem(key); } catch (_) {}
        return null;
      }
      return obj.d;
    } catch (_) {
      return null;
    }
  }

  /* =========================================================================
   * §6 API TRANSPORT
   * ========================================================================= */
  async function fetchApi(action, signal) {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action }),
      signal
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.json();
  }

  /* =========================================================================
   * §7 SKELETON
   * ========================================================================= */
  function renderLiveSkeletons() {
    if (!el.liveGrid) return;
    const sk = `
      <article class="live-card skeleton" aria-hidden="true">
        <div class="skel-header">
          <span class="skel-box" style="width:48px;height:20px;border-radius:6px"></span>
          <span class="skel-box" style="width:72px;height:20px;border-radius:var(--r-full)"></span>
        </div>
        <span class="skel-box" style="width:80%;height:16px"></span>
        <div class="skel-body">
          <span class="skel-box" style="width:60%;height:26px"></span>
        </div>
      </article>`;
    el.liveGrid.innerHTML = Array(9).fill(sk).join('');
    el.liveGrid.setAttribute('aria-busy', 'true');
  }

  /* =========================================================================
   * §8 LIVE — LOAD / RENDER / POLL
   * ========================================================================= */
  async function loadLive() {
    const L = state.live;
    if (L.inFlight) return;
    if (document.hidden) return;
    if (state.activeTab !== 'tab-live') return;

    clearTimeout(L.pollTimeout);
    L.pollTimeout = null;

    L.inFlight = true;
    L.timedOut = false;
    const controller = new AbortController();
    L.controller = controller;
    L.timeoutId = setTimeout(() => { L.timedOut = true; controller.abort(); }, FETCH_TIMEOUT);

    try {
      const data = await fetchApi('publik_panggung', controller.signal);

      if (data && data.server_ms) {
        L.serverOffset = Number(data.server_ms) - Date.now();
      } else if (data && data.server_time) {
        const parsed = new Date(data.server_time).getTime();
        if (Number.isFinite(parsed)) L.serverOffset = parsed - Date.now();
      }

      if (data && data.status === 'success' && Array.isArray(data.cabang)) {
        const newHash = hashLiveData(data.cabang);
        if (newHash !== L.lastHash) {
          L.lastHash = newHash;
          renderLive(data.cabang);
        } else {
          maybeStartTicker();   // offset waktu server bisa berubah; pastikan ticker tetap berjalan
        }
        saveCache(LIVE_CACHE_KEY, data);
        L.retryDelay = 0;
        L.loadedOnce = true;
        setConnBadge('ok');
      } else {
        throw new Error((data && data.message) || 'Respons tidak valid');
      }
    } catch (e) {
      // Abort karena pagehide (bukan timeout) = bukan kegagalan jaringan.
      if (e.name === 'AbortError' && !L.timedOut) return;
      console.warn('[live] fetch failed:', e);
      L.retryDelay = Math.min((L.retryDelay || 0) + BACKOFF_STEP, MAX_BACKOFF);
      setConnBadge(L.loadedOnce ? 'warn' : 'error');
      if (!L.loadedOnce) renderLiveError();
    } finally {
      clearTimeout(L.timeoutId);
      L.timeoutId = null;
      if (L.controller === controller) {
        L.controller = null;
        L.inFlight = false;
      }
      scheduleNextPoll();
    }
  }

  function scheduleNextPoll() {
    clearTimeout(state.live.pollTimeout);
    state.live.pollTimeout = null;
    if (state.activeTab !== 'tab-live' || document.hidden) return;
    const delay = POLL_INTERVAL + (state.live.retryDelay || 0) + Math.floor(Math.random() * POLL_JITTER);
    state.live.pollTimeout = setTimeout(loadLive, delay);
  }

  function renderLiveError() {
    if (!el.liveGrid) return;
    el.liveGrid.setAttribute('aria-busy', 'false');
    el.liveGrid.innerHTML = `
      <div class="empty-state" style="grid-column:1/-1;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/>
        </svg>
        <p>Gagal memuat data live.<br>Menghubungkan ulang otomatis...</p>
      </div>`;
  }

  function renderLive(cabangList) {
    if (!el.liveGrid) return;

    if (!cabangList.length) {
      el.liveGrid.setAttribute('aria-busy', 'false');
      el.liveGrid.innerHTML = `
        <div class="empty-state" style="grid-column:1/-1;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/>
          </svg>
          <p>Belum ada cabang yang terdaftar.</p>
        </div>`;
      return;
    }

    const sorted = cabangList.slice().sort((a, b) => ORDER.indexOf(a.key) - ORDER.indexOf(b.key));
    const serverNow = Date.now() + state.live.serverOffset;

    el.liveGrid.innerHTML = sorted.map(c => renderLiveCard(c, serverNow)).join('');
    el.liveGrid.setAttribute('aria-busy', 'false');

    maybeStartTicker();
  }

  function renderLiveCard(c, serverNow) {
    const status = c.status_lomba || 'belum';
    const isLive = status === 'berlangsung';
    const isSelesai = status === 'selesai';
    const statusLabel = STATUS_LABEL[status] || status;

    let bodyHtml = '';
    let footerHtml = '';

    if (isSelesai) {
      bodyHtml = `
        <div class="lc-label">Status</div>
        <div class="lc-main lc-finished">Lomba Telah Selesai</div>
      `;
      if (c.mode === 'queue' && c.total_peserta) {
        footerHtml = `
          <div class="lc-footer" style="justify-content: center;">
            <span>Total Peserta: <strong>${esc(c.total_peserta)}</strong></span>
          </div>
        `;
      }
    } else if (c.mode === 'queue') {
      const now = c.sekarang;
      const next = c.berikut;
      bodyHtml = `
        <div class="lc-label">Sedang Tampil</div>
        <div class="lc-main">${now ? esc(now.No_Undian) : '—'}</div>
      `;
      const progress = (typeof c.sudah_tampil === 'number' && c.total_peserta)
        ? `<span class="lc-progress">${esc(c.sudah_tampil)}/${esc(c.total_peserta)}</span>` : '';
      footerHtml = `
        <div class="lc-footer">
          <span>Berikutnya</span>
          <strong>${next ? esc(next.No_Undian) : '—'}</strong>
          ${progress}
        </div>
      `;
    } else if (c.mode === 'timer') {
      const endMs = timerEndMs(c);
      const durSec = Number(c.timer_duration_sec) || 0;

      let timerStr = durSec ? fmtTimer(durSec) : '00:00:00';
      let timeup = false;
      if (endMs) {
        const sisa = Math.max(0, Math.ceil((endMs - serverNow) / 1000));
        timeup = sisa <= 0;
        timerStr = fmtTimer(sisa);
      }

      bodyHtml = `
        <div class="lc-label">${timeup ? 'Waktu Habis' : 'Sisa Waktu'}</div>
        <div class="lc-timer${timeup ? ' is-timeup' : ''}"
             data-timer
             data-timer-end="${endMs || ''}">${timerStr}</div>
        ${timeup ? '<div class="lc-timeup">WAKTU HABIS</div>' : ''}
      `;
    } else if (c.mode === 'phase') {
      bodyHtml = `
        <div class="lc-label">Fase Saat Ini</div>
        <div class="lc-phase">${c.phase_label ? esc(c.phase_label) : '—'}</div>
      `;
    }

    return `
      <article class="live-card ${isLive ? 'is-live' : ''}" data-status="${esc(status)}" data-cabang="${esc(c.key)}">
        <div class="lc-header">
          <span class="lc-kode">${esc(c.kode)}</span>
          <span class="lc-badge ${esc(status)}">${esc(statusLabel)}</span>
        </div>
        <div class="lc-title">${esc((c.label || '').split('(')[0].trim())}</div>
        <div class="lc-body">${bodyHtml}</div>
        ${footerHtml}
      </article>
    `;
  }

  /* =========================================================================
   * §9 TIMER TICKER (local, no re-fetch)
   * ========================================================================= */
  function maybeStartTicker() {
    const els = document.querySelectorAll('[data-timer]');
    let active = false;
    for (const elm of els) {
      if (parseInt(elm.dataset.timerEnd, 10) > 0) { active = true; break; }
    }
    if (active) startTicker();
    else stopTicker();
  }

  function startTicker() {
    if (state.ticker) return;
    state.ticker = setInterval(tickTimers, 1000);
    tickTimers();
  }

  function stopTicker() {
    if (state.ticker) { clearInterval(state.ticker); state.ticker = null; }
  }

  function tickTimers() {
    const els = document.querySelectorAll('[data-timer]');
    if (!els.length) { stopTicker(); return; }

    const serverNow = Date.now() + state.live.serverOffset;
    let anyActive = false;

    for (const elm of els) {
      const endMs = parseInt(elm.dataset.timerEnd, 10);
      if (!endMs) continue;

      anyActive = true;
      const sisa = Math.max(0, Math.ceil((endMs - serverNow) / 1000));
      const txt = fmtTimer(sisa);
      if (elm.textContent !== txt) elm.textContent = txt;

      const timeup = sisa <= 0;
      if (timeup !== elm.classList.contains('is-timeup')) {
        elm.classList.toggle('is-timeup', timeup);
      }
    }

    if (!anyActive) stopTicker();
  }

  /* =========================================================================
   * §10 PESERTA — LOAD / FILTER / URUT / RENDER
   * ========================================================================= */
  const PAGE = 60;                                   // baris per "halaman" (render bertahap)
  const PV_KEY = 'mtq26_pview_v1';
  const COL = new Intl.Collator('id', { numeric: true, sensitivity: 'base' });
  const CAB_LABEL = {
    MTQ: "Tilawatil Qur'an", MTtQ: "Tartil Qur'an", MHQ: "Hifdzil Qur'an", Puitisasi: 'Puitisasi Saritilawah',
    MAz: 'Adzan', LPP: 'Pidato PAI', LCP: 'Cerdas Cermat PAI', Lukis: 'Melukis Islami', Menyanyi: 'Menyanyi Islami'
  };
  const SORT_FN = {
    kapanewon: (a, b) => COL.compare(a.Kapanewon, b.Kapanewon) || COL.compare(a._nama1, b._nama1),
    nama:      (a, b) => COL.compare(a._title, b._title),
    sekolah:   (a, b) => COL.compare(a._sekolah1, b._sekolah1) || COL.compare(a._nama1, b._nama1),
    cabang:    (a, b) => (a._cab - b._cab) || COL.compare(a.Kapanewon, b.Kapanewon) || COL.compare(a._nama1, b._nama1),
    no:        (a, b) => COL.compare(String(a.No_Pendaftaran), String(b.No_Pendaftaran))
  };
  const DIR_LABEL = { 1: 'A–Z ↑', '-1': 'Z–A ↓' };
  const pv = { q: '', cabang: '', kap: '', sort: 'kapanewon', dir: 1, group: '' };
  let view = [];            // hasil filter+urut
  let shown = 0;            // jumlah baris sudah dirender
  let lastGroup = null;
  let moreObserver = null;

  function loadPrefs() {
    try {
      const o = JSON.parse(sessionStorage.getItem(PV_KEY) || 'null');
      if (!o) return;
      if (SORT_FN[o.sort]) pv.sort = o.sort;
      if (o.dir === -1) pv.dir = -1;
      if (o.group === 'cabang' || o.group === 'kapanewon') pv.group = o.group;
      if (typeof o.cabang === 'string') pv.cabang = o.cabang;
      if (typeof o.kap === 'string') pv.kap = o.kap;
    } catch (_) {}
  }
  function savePrefs() {
    try { sessionStorage.setItem(PV_KEY, JSON.stringify({ sort: pv.sort, dir: pv.dir, group: pv.group, cabang: pv.cabang, kap: pv.kap })); } catch (_) {}
  }

  async function loadPeserta() {
    const P = state.peserta;
    if (P.inFlight) return;

    P.inFlight = true;
    P.timedOut = false;
    const controller = new AbortController();
    P.controller = controller;
    P.timeoutId = setTimeout(() => { P.timedOut = true; controller.abort(); }, FETCH_TIMEOUT);
    if (el.pesertaGrid) el.pesertaGrid.setAttribute('aria-busy', 'true');

    try {
      const data = await fetchApi('publik_peserta_list', controller.signal);

      if (data && data.status === 'success' && Array.isArray(data.peserta)) {
        const raw = JSON.stringify(data.peserta);
        const changed = raw !== P.raw || !P.rendered;     // data sama → tidak render ulang (scroll tidak loncat)
        P.raw = raw;
        P.loaded = true;
        saveCache(PESERTA_CACHE_KEY, { peserta: data.peserta });
        if (changed) setPesertaData(data.peserta);
      } else {
        throw new Error((data && data.message) || 'Invalid response');
      }
    } catch (e) {
      if (e.name === 'AbortError' && !P.timedOut) return;
      console.warn('[peserta] fetch failed:', e);
      if (!P.loaded) renderPesertaError();
    } finally {
      clearTimeout(P.timeoutId);
      P.timeoutId = null;
      if (P.controller === controller) P.controller = null;
      P.inFlight = false;
      if (el.pesertaGrid) el.pesertaGrid.setAttribute('aria-busy', 'false');
    }
  }

  function setPesertaData(list) {
    const P = state.peserta;
    P.data = list.map(decoratePeserta);
    buildKapOptions();
    applyView();
  }

  function decoratePeserta(p) {
    const nama1 = p.Nama_Lengkap || p.Nama || '';
    const sekolah1 = p.Asal_Sekolah_1 || p.Asal_Sekolah || p.Sekolah || '';
    const sekolah2 = p.Asal_Sekolah_2 || p.Sekolah_2 || sekolah1;
    const sekolah3 = p.Asal_Sekolah_3 || p.Sekolah_3 || sekolah1;
    const idx = ORDER.indexOf(p.Cabang);

    p._nama1 = nama1;
    p._sekolah1 = sekolah1;
    p._sekolah2 = sekolah2;
    p._sekolah3 = sekolah3;
    p._cab = idx < 0 ? 99 : idx;
    p._team = p.Cabang === 'LCP' && !!(p.Anggota_2 || p.Anggota_3);
    p._title = p._team ? 'Tim ' + (p.Kapanewon || '') : nama1;   // judul yang tampil = kunci urut nama
    p.Kapanewon = p.Kapanewon || '';
    p._search = [
      nama1, p.Anggota_2, p.Anggota_3,
      sekolah1, sekolah2, sekolah3,
      p.Kapanewon, p.Cabang, CAB_LABEL[p.Cabang], p.No_Pendaftaran
    ].filter(Boolean).join(' ').toUpperCase();
    return p;
  }

  function renderPesertaError() {
    if (!el.pesertaGrid) return;
    el.pesertaGrid.setAttribute('aria-busy', 'false');
    el.pesertaGrid.innerHTML = `
      <div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/>
        </svg>
        <p>Gagal memuat data peserta.<br>Periksa koneksi internet Anda.</p>
      </div>`;
    if (el.ptMore) el.ptMore.hidden = true;
  }

  /** Opsi dropdown kapanewon dari data (urut abjad). */
  function buildKapOptions() {
    const sel = $('#ptKap'); if (!sel) return;
    const set = new Set(state.peserta.data.map(p => p.Kapanewon).filter(Boolean));
    const arr = Array.from(set).sort(COL.compare);
    if (pv.kap && !set.has(pv.kap)) pv.kap = '';
    sel.innerHTML = '<option value="">Semua kapanewon</option>' + arr.map(k => `<option value="${esc(k)}">${esc(k)}</option>`).join('');
    sel.value = pv.kap;
  }

  /** Chip cabang + jumlah (menghormati pencarian & kapanewon, bukan cabang). */
  function renderChips(base) {
    const box = $('#ptChips'); if (!box) return;
    const cnt = {};
    for (const p of base) cnt[p.Cabang] = (cnt[p.Cabang] || 0) + 1;
    const keys = ORDER.filter(k => cnt[k] || k === pv.cabang);
    for (const k of Object.keys(cnt)) if (!keys.includes(k)) keys.push(k);
    box.innerHTML =
      `<button type="button" class="chip" data-cab="" aria-pressed="${pv.cabang === ''}">Semua <small>${base.length}</small></button>` +
      keys.map(k => `<button type="button" class="chip" data-cab="${esc(k)}" title="${esc(CAB_LABEL[k] || k)}" aria-pressed="${pv.cabang === k}"${cnt[k] ? '' : ' disabled'}>${esc(k)} <small>${cnt[k] || 0}</small></button>`).join('');
  }

  /** Filter → urut → render halaman pertama. */
  function applyView() {
    const P = state.peserta;
    const tokens = pv.q.toUpperCase().split(/\s+/).filter(Boolean);
    const base = P.data.filter(p =>
      (!pv.kap || p.Kapanewon === pv.kap) && tokens.every(t => p._search.includes(t)));
    renderChips(base);
    view = pv.cabang ? base.filter(p => p.Cabang === pv.cabang) : base.slice();

    const fn = SORT_FN[pv.sort] || SORT_FN.kapanewon;
    const dir = pv.dir;
    const gk = pv.group === 'cabang' ? (a, b) => a._cab - b._cab
             : pv.group === 'kapanewon' ? (a, b) => COL.compare(a.Kapanewon, b.Kapanewon) : null;
    view.sort((a, b) => (gk ? gk(a, b) : 0) || dir * fn(a, b));
    P.filteredData = view;

    syncControls(base.length);
    renderPeserta();
  }

  function activeFilterCount() { return (pv.cabang ? 1 : 0) + (pv.kap ? 1 : 0) + (pv.group ? 1 : 0) + (pv.sort !== 'kapanewon' || pv.dir !== 1 ? 1 : 0); }

  function syncControls() {
    const total = state.peserta.data.length;
    const n = view.length;
    $('#ptCount').innerHTML = `<span>${n === total ? `<strong>${total}</strong> peserta` : `Menampilkan <strong>${n}</strong> dari ${total} peserta`}</span>` +
      `<span>Urut: ${esc({ kapanewon: 'Kapanewon', nama: 'Nama', sekolah: 'Sekolah', cabang: 'Cabang', no: 'No. Pendaftaran' }[pv.sort])} ${pv.dir === 1 ? '↑' : '↓'}</span>`;
    $('#ptSort').value = pv.sort;
    $('#ptGroup').value = pv.group;
    $('#ptKap').value = pv.kap;
    $('#ptDir').textContent = DIR_LABEL[pv.dir];
    const filtered = !!(pv.q || pv.cabang || pv.kap);
    $('#ptReset').hidden = !(filtered || activeFilterCount());
    $('#ptClear').classList.toggle('show', !!el.searchInput.value);
    const badge = $('#ptBadge'); const ac = (pv.cabang ? 1 : 0) + (pv.kap ? 1 : 0) + (pv.group ? 1 : 0);
    badge.textContent = ac; badge.classList.toggle('show', ac > 0);
    for (const b of $$('#plHead button')) {
      const on = b.dataset.sort === pv.sort;
      if (on) b.setAttribute('aria-sort', pv.dir === 1 ? 'ascending' : 'descending'); else b.removeAttribute('aria-sort');
      b.querySelector('.ar').textContent = on ? (pv.dir === 1 ? '▲' : '▼') : '';
    }
  }

  function renderPeserta() {
    const grid = el.pesertaGrid; if (!grid) return;
    grid.setAttribute('aria-busy', 'false');
    state.peserta.rendered = true;

    if (!view.length) {
      const hasData = state.peserta.data.length > 0;
      grid.innerHTML = `
        <div class="empty-state">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
          </svg>
          <p>${hasData ? 'Tidak ada peserta yang cocok dengan pencarian/filter.' : 'Belum ada peserta yang terverifikasi.'}</p>
        </div>`;
      shown = 0; lastGroup = null; updateMore();
      return;
    }
    grid.innerHTML = '';
    shown = 0; lastGroup = null;
    appendRows(PAGE);
  }

  /** Tambah baris bertahap (tidak merender ulang yang sudah ada → scroll stabil). */
  function appendRows(n) {
    const end = Math.min(view.length, shown + n);
    let h = '';
    for (let i = shown; i < end; i++) {
      const p = view[i];
      if (pv.group) {
        const g = pv.group === 'cabang' ? p.Cabang : p.Kapanewon;
        if (g !== lastGroup) {
          lastGroup = g;
          const total = view.reduce((c, x) => c + ((pv.group === 'cabang' ? x.Cabang : x.Kapanewon) === g ? 1 : 0), 0);
          h += `<div class="pl-group"><span>${esc(g)}${pv.group === 'cabang' && CAB_LABEL[g] ? ' — ' + esc(CAB_LABEL[g]) : ''}</span><small>${total} peserta</small></div>`;
        }
      }
      h += renderPesertaRow(p);
    }
    el.pesertaGrid.insertAdjacentHTML('beforeend', h);
    shown = end;
    updateMore();
  }

  function updateMore() {
    const more = el.ptMore; if (!more) return;
    const rest = view.length - shown;
    more.hidden = rest <= 0;
    if (rest > 0) {
      $('#btnMore').textContent = `Tampilkan ${Math.min(PAGE, rest)} lagi (sisa ${rest})`;
      if ('IntersectionObserver' in window) {
        if (!moreObserver) moreObserver = new IntersectionObserver(es => { if (es.some(x => x.isIntersecting)) loadMore(); }, { rootMargin: '400px' });
        moreObserver.disconnect(); moreObserver.observe(more);
      }
    } else if (moreObserver) moreObserver.disconnect();
  }
  function loadMore() { if (shown < view.length) appendRows(PAGE); }

  function renderPesertaRow(p) {
    const isTeam = p._team;
    let nameHtml, schoolHtml;
    if (isTeam) {
      const names = [p._nama1, p.Anggota_2, p.Anggota_3].filter(Boolean);
      const schools = Array.from(new Set([p._sekolah1, p._sekolah2, p._sekolah3].filter(Boolean)));
      nameHtml = `<div class="pr-name">Tim ${esc(p.Kapanewon)}</div><div class="pr-sub">${names.map((n, i) => `${i + 1}. ${esc(n)}`).join(' · ')}</div>`;
      schoolHtml = schools.map(esc).join(' / ');
    } else {
      nameHtml = `<div class="pr-name">${esc(p._nama1)}</div>`;
      schoolHtml = esc(p._sekolah1);
    }
    return `<article class="peserta-row">
      <div class="pr-no">${esc(p.No_Pendaftaran)}</div>
      <div class="pr-main">${nameHtml}</div>
      <div class="pr-school">${schoolHtml || '—'}</div>
      <div class="pr-kap">${esc(p.Kapanewon)}</div>
      <div class="pr-cab" title="${esc(CAB_LABEL[p.Cabang] || p.Cabang)}">${esc(p.Cabang)}</div>
    </article>`;
  }

  function setSort(key) {
    if (!SORT_FN[key]) return;
    if (pv.sort === key) pv.dir = -pv.dir; else { pv.sort = key; pv.dir = 1; }
    savePrefs(); applyView();
  }
  function resetView() {
    pv.q = ''; pv.cabang = ''; pv.kap = ''; pv.sort = 'kapanewon'; pv.dir = 1; pv.group = '';
    el.searchInput.value = '';
    savePrefs(); applyView();
  }

  function wirePeserta() {
    let t = null;
    el.searchInput.addEventListener('input', e => {
      const v = e.target.value;
      $('#ptClear').classList.toggle('show', !!v);
      clearTimeout(t);
      t = setTimeout(() => { pv.q = v.trim(); applyView(); }, SEARCH_DEBOUNCE);
    });
    $('#ptClear').addEventListener('click', () => { el.searchInput.value = ''; pv.q = ''; applyView(); el.searchInput.focus(); });
    $('#ptChips').addEventListener('click', e => {
      const b = e.target.closest('[data-cab]'); if (!b || b.disabled) return;
      pv.cabang = pv.cabang === b.dataset.cab ? '' : b.dataset.cab; savePrefs(); applyView();
    });
    $('#ptKap').addEventListener('change', e => { pv.kap = e.target.value; savePrefs(); applyView(); });
    $('#ptSort').addEventListener('change', e => { pv.sort = e.target.value; pv.dir = 1; savePrefs(); applyView(); });
    $('#ptGroup').addEventListener('change', e => { pv.group = e.target.value; savePrefs(); applyView(); });
    $('#ptDir').addEventListener('click', () => { pv.dir = -pv.dir; savePrefs(); applyView(); });
    $('#ptReset').addEventListener('click', resetView);
    $('#plHead').addEventListener('click', e => { const b = e.target.closest('[data-sort]'); if (b) setSort(b.dataset.sort); });
    $('#btnMore').addEventListener('click', loadMore);
    $('#ptToggle').addEventListener('click', () => {
      const open = $('#ptPanel').classList.toggle('open');
      $('#ptToggle').setAttribute('aria-expanded', String(open));
    });
  }

  /* =========================================================================
   * §11 TAB SWITCH
   * ========================================================================= */
  function switchTab(target) {
    if (state.activeTab === target) return;
    state.activeTab = target;

    for (const btn of el.tabBtns) {
      const active = btn.dataset.tab === target;
      btn.classList.toggle('active', active);
      btn.setAttribute('aria-selected', String(active));
    }
    for (const pane of el.tabPanes) {
      pane.classList.toggle('active', pane.id === target);
    }

    if (target === 'tab-live') {
      clearTimeout(state.live.pollTimeout);
      state.live.pollTimeout = null;
      if (!state.live.inFlight) loadLive();
    } else {
      clearTimeout(state.live.pollTimeout);
      state.live.pollTimeout = null;

      if (target === 'tab-peserta') {
        if (state.peserta.loaded) {
          if (!state.peserta.rendered) { buildKapOptions(); applyView(); }
          loadPeserta();
        } else if (!state.peserta.inFlight) {
          el.pesertaGrid.setAttribute('aria-busy', 'true');
          loadPeserta();
        }
      }
    }

    const h = target === 'tab-peserta' ? '#peserta' : '#live';
    if (location.hash !== h) {
      try { history.replaceState(null, '', h); } catch (_) {}
    }
  }

  /* =========================================================================
   * §12 FULLSCREEN + CLOCK
   * ========================================================================= */
  const ICON_ENTER = '<path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>';
  const ICON_EXIT  = '<path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/>';

  function setFsButton(isFs) {
    if (!el.fsIcon || !el.fsLabel) return;
    el.fsIcon.innerHTML = isFs ? ICON_EXIT : ICON_ENTER;
    el.fsLabel.textContent = isFs ? 'Keluar' : 'Fullscreen';
    el.btnFs.setAttribute('aria-label', isFs ? 'Keluar dari layar penuh' : 'Masuk ke layar penuh');
  }

  function updateFsClock() {
    if (!el.fsClock) return;
    el.fsClock.textContent = fmtClock(new Date());
  }

  function startFsClock() {
    stopFsClock();
    updateFsClock();
    state.fsClock = setInterval(updateFsClock, 30000);
  }

  function stopFsClock() {
    if (state.fsClock) { clearInterval(state.fsClock); state.fsClock = null; }
  }

  function toggleFullscreen() {
    const isFs = document.body.classList.contains('is-fullscreen');
    if (!isFs) {
      document.body.classList.add('is-fullscreen');
      setFsButton(true);
      startFsClock();
      if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(() => {});
      }
    } else {
      document.body.classList.remove('is-fullscreen');
      setFsButton(false);
      stopFsClock();
      if (document.exitFullscreen && document.fullscreenElement) {
        document.exitFullscreen().catch(() => {});
      }
    }
  }

  /* =========================================================================
   * §13 EVENT WIRING
   * ========================================================================= */
  function wireEvents() {
    for (const btn of el.tabBtns) {
      btn.addEventListener('click', () => switchTab(btn.dataset.tab));
    }

    wirePeserta();

    el.btnFs.addEventListener('click', toggleFullscreen);

    document.addEventListener('fullscreenchange', () => {
      const nativeFs = !!document.fullscreenElement;
      const bodyFs = document.body.classList.contains('is-fullscreen');
      if (nativeFs && !bodyFs) {
        document.body.classList.add('is-fullscreen');
        setFsButton(true);
        startFsClock();
      } else if (!nativeFs && bodyFs) {
        document.body.classList.remove('is-fullscreen');
        setFsButton(false);
        stopFsClock();
      }
    });

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        clearTimeout(state.live.pollTimeout);
        state.live.pollTimeout = null;
      } else if (state.activeTab === 'tab-live' && !state.live.inFlight) {
        loadLive();
      }
    });

    window.addEventListener('hashchange', () => {
      const h = location.hash.replace('#', '');
      if (h === 'peserta' && state.activeTab !== 'tab-peserta') switchTab('tab-peserta');
      else if ((h === 'live' || h === '') && state.activeTab !== 'tab-live') switchTab('tab-live');
    });

    // Layar kembali dari cache back/forward (bfcache): polling harus dilanjutkan.
    window.addEventListener('pageshow', (e) => {
      if (!e.persisted) return;
      state.live.inFlight = false;
      state.peserta.inFlight = false;
      if (state.activeTab === 'tab-live') loadLive();
    });

    window.addEventListener('pagehide', cleanup);
  }

  function cleanup() {
    stopTicker();
    stopFsClock();
    clearTimeout(state.live.pollTimeout);
    clearTimeout(state.live.timeoutId);
    clearTimeout(state.peserta.timeoutId);
    if (state.live.controller) try { state.live.controller.abort(); } catch (_) {}
    if (state.peserta.controller) try { state.peserta.controller.abort(); } catch (_) {}
  }

  /* =========================================================================
   * §14 BOOTSTRAP
   * ========================================================================= */
  function bootstrap() {
    cacheDom();
    loadPrefs();
    wireEvents();

    let paintedLive = false;
    const liveCache = loadCache(LIVE_CACHE_KEY);
    if (liveCache && Array.isArray(liveCache.cabang) && liveCache.cabang.length) {
      if (liveCache.server_ms) {
        state.live.serverOffset = Number(liveCache.server_ms) - Date.now();
      } else if (liveCache.server_time) {
        const parsed = new Date(liveCache.server_time).getTime();
        if (Number.isFinite(parsed)) state.live.serverOffset = parsed - Date.now();
      }
      state.live.lastHash = hashLiveData(liveCache.cabang);
      renderLive(liveCache.cabang);
      state.live.loadedOnce = true;
      setConnBadge('warn');
      paintedLive = true;
    }

    const pesertaCache = loadCache(PESERTA_CACHE_KEY);
    if (pesertaCache && Array.isArray(pesertaCache.peserta)) {
      state.peserta.raw = JSON.stringify(pesertaCache.peserta);
      state.peserta.data = pesertaCache.peserta.map(p => decoratePeserta(p));
      state.peserta.loaded = true;
    }

    const h = location.hash.replace('#', '');
    if (h === 'peserta') {
      state.activeTab = 'tab-peserta';
      for (const btn of el.tabBtns) {
        const active = btn.dataset.tab === 'tab-peserta';
        btn.classList.toggle('active', active);
        btn.setAttribute('aria-selected', String(active));
      }
      for (const pane of el.tabPanes) {
        pane.classList.toggle('active', pane.id === 'tab-peserta');
      }
      if (state.peserta.loaded) {
        buildKapOptions();
        applyView();
      } else {
        el.pesertaGrid.setAttribute('aria-busy', 'true');
      }
      loadPeserta();
      if (!paintedLive) renderLiveSkeletons();
    } else {
      if (!paintedLive) renderLiveSkeletons();
      loadLive();
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', bootstrap);
  } else {
    bootstrap();
  }
})();
</script>

</body>
</html>
